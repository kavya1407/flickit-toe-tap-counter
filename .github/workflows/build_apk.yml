name: Build Android APK & Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Automated Unit Tests
        run: flutter test

      - name: Build Release APK
        id: build_step
        continue-on-error: true
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Push Build Debug Log on Failure
        if: steps.build_step.outcome == 'failure'
        run: |
          flutter build apk --release --android-skip-build-dependency-validation -v > build_failure.txt 2>&1 || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-debug
          git add build_failure.txt
          git commit -m "debug: add build failure log" || true
          git push -f origin build-debug || true
          exit 1

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: steps.build_step.outcome == 'success'
        with:
          name: toe-tap-counter-release-apk
          path: "**/*.apk"
          retention-days: 14
