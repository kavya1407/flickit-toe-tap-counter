name: Build Android APK & Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Automated Unit Tests
        run: flutter test

      - name: Build Release APK
        run: |
          flutter build apk --release -v > build.log 2>&1 || { echo "=== BUILD FAILED: LAST 150 LINES ==="; tail -n 150 build.log; exit 1; }

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: toe-tap-counter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
